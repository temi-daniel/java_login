spring.mvc.view.prefix=/pages/
spring.mvc.view.suffix=.jsp

# Set these as environment variables on the server (see deploy/tomcat.env.example).
# The defaults below only work for a local MySQL on your own machine.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/UserDB}
spring.datasource.username=${DB_USERNAME:appuser}
spring.datasource.password=${DB_PASSWORD:change-me}
